name: Lighthouse

# Lighthouse (mobile) on the Vercel preview for home, a city page and a brewery page, against the
# budgets in lighthouserc.cjs. Informational: it comments the scores on the PR and never blocks it.
#
# Needs the repository secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel > Settings > Deployment
# Protection > Protection Bypass for Automation): previews are behind Vercel Authentication.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse on the preview (non-blocking)
    runs-on: ubuntu-latest
    # Secrets can't appear in step conditions; this flag can
    env:
      HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
        continue-on-error: true

      - name: Skip without the bypass secret
        if: env.HAS_BYPASS != 'true'
        run: |
          echo "::notice::Lighthouse skipped: add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret so it can reach the protected preview."

      - name: Run Lighthouse CI
        id: lhci
        if: steps.preview.outputs.url != '' && env.HAS_BYPASS == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.cjs
        continue-on-error: true

      - name: Keep the reports with the run
        if: hashFiles('.lighthouseci/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

      - name: Comment the scores on the PR
        if: steps.preview.outputs.url != '' && hashFiles('.lighthouseci/manifest.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
            const rows = manifest.filter((r) => r.isRepresentativeRun).map((r) => {
              const lhr = JSON.parse(fs.readFileSync(r.jsonPath, 'utf8'));
              const a = lhr.audits;
              const perf = Math.round(lhr.categories.performance.score * 100);
              const lcp = a['largest-contentful-paint'].numericValue / 1000;
              const cls = a['cumulative-layout-shift'].numericValue;
              const ok = (pass) => (pass ? '✅' : '⚠️');
              const path = new URL(r.url).pathname;
              return `| \`${path}\` | ${ok(perf >= 90)} ${perf} | ${ok(lcp < 2.5)} ${lcp.toFixed(1)} s | ${ok(cls < 0.05)} ${cls.toFixed(3)} | ${Math.round(lhr.categories.accessibility.score * 100)} |`;
            });
            const body = [
              '<!-- lighthouse-ci -->',
              '### Lighthouse (mobile, Vercel preview, median of 3)',
              'Budgets: Performance ≥ 90, LCP < 2.5 s, CLS < 0.05. Non-blocking.',
              `Full reports: the lighthouse-reports artifact of [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              '| Page | Performance | LCP | CLS | Accessibility |',
              '|---|---|---|---|---|',
              ...rows,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes('<!-- lighthouse-ci -->'));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
